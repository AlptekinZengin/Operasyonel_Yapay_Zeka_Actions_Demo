name: random-forest-hastalik-teshisi

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: iterative/setup-cml@v2

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Modeli egit
        run: python operasyonel/kalphastaligi.py

      - name: Grafigi yukle
        uses: actions/upload-artifact@v4
        with:
          name: model-raporu
          path: |
            metrikler.txt
            ozellik_onem.png

      - name: CML raporu olustur ve yorum olarak yayinla
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Model Metrikleri" >> rapor.md
          cat metrikler.txt >> rapor.md
          echo "" >> rapor.md
          echo "Ozellik onemi grafigi: [model-raporu artifact](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> rapor.md
          cat rapor.md >> "$GITHUB_STEP_SUMMARY"
          cml comment create rapor.md